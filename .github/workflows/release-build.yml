name: Release artifacts

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v1.1.0
        type: string
        required: true

permissions:
  contents: write

env:
  CI: "1"
  RELEASE_TAG: ${{ inputs.tag }}
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      android_signing: ${{ steps.signing.outputs.ready }}
      android_self_hosted: ${{ steps.runner.outputs.self_hosted }}
    steps:
      - name: Require an existing versioned release
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Use a stable release tag such as v1.1.0' >&2
            exit 1
          fi
          gh release view "$RELEASE_TAG" --json tagName --jq .tagName

      - name: Check Android signing configuration
        id: signing
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Android artifacts skipped: configure all four release signing secrets in docs/releases.md.' >> "$GITHUB_STEP_SUMMARY"
          fi

      # A job that targets an offline self-hosted runner waits in the queue instead of falling back.
      - name: Select Android runner
        id: runner
        env:
          GH_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
        # GitHub drops a job output that contains a secret value, and a secret masks "opencoode".
        # So the output carries a boolean, and the Android job holds the labels.
        run: |
          self_hosted=false
          if [[ -n "$GH_TOKEN" ]] && gh api "repos/$GH_REPO/actions/runners" \
            --jq '.runners[] | select(.status == "online") | .labels[].name' | grep -qx opencoode-pc; then
            self_hosted=true
          fi
          echo "self_hosted=$self_hosted" >> "$GITHUB_OUTPUT"
          echo "Android runner is self-hosted: $self_hosted" >> "$GITHUB_STEP_SUMMARY"

  android:
    needs: prepare
    if: needs.prepare.outputs.android_signing == 'true'
    concurrency:
      group: release-artifacts-${{ inputs.tag }}-android
      cancel-in-progress: false
    runs-on: ${{ needs.prepare.outputs.android_self_hosted == 'true' && fromJSON('["self-hosted","opencoode-pc"]') || 'ubuntu-latest' }}
    timeout-minutes: 60
    env:
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: pnpm/setup@v3.2.0
        with:
          runtime: node@26
          cache: true
          install: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Choose Gradle worker count
        run: |
          workers=2
          if [[ "$RUNNER_ENVIRONMENT" == self-hosted ]]; then
            workers="$(nproc)"
          fi
          echo "GRADLE_MAX_WORKERS=$workers" >> "$GITHUB_ENV"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          umask 077
          RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/opencoode-release.jks"
          echo "RELEASE_KEYSTORE_PATH=$RELEASE_KEYSTORE_PATH" >> "$GITHUB_ENV"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RELEASE_KEYSTORE_PATH"

      - name: Prepare native Android project
        run: |
          pnpm install --frozen-lockfile
          node .github/scripts/prepare-release.mjs
          pnpm exec expo prebuild --platform android --no-install

      - name: Build signed per-ABI APKs
        working-directory: android
        run: ./gradlew --no-daemon --max-workers="$GRADLE_MAX_WORKERS" --init-script ../.github/android-signing.gradle -PopencoodeGithubApks=true assembleRelease

      - name: Build signed app bundle
        working-directory: android
        run: ./gradlew --no-daemon --max-workers="$GRADLE_MAX_WORKERS" --init-script ../.github/android-signing.gradle bundleRelease

      - name: Publish Android artifacts
        shell: bash
        run: |
          signer="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ ! -x "$signer" ]]; then
            echo 'No executable apksigner was found in the Android SDK build tools' >&2
            exit 1
          fi
          expected="$(keytool -exportcert -keystore "$RELEASE_KEYSTORE_PATH" -storepass:env RELEASE_STORE_PASSWORD -alias "$RELEASE_KEY_ALIAS" | sha256sum | cut -d' ' -f1)"
          mkdir -p artifacts
          for apk in android/app/build/outputs/apk/release/app*-release.apk; do
            actual="$("$signer" verify --print-certs-pem "$apk" | sed -n '/^-----BEGIN CERTIFICATE-----$/,/^-----END CERTIFICATE-----$/p' | openssl x509 -outform DER | sha256sum | cut -d' ' -f1)"
            if [[ -z "$expected" || "$expected" != "$actual" ]]; then
              printf 'The APK signer for %s does not match the supplied release key\n' "$apk" >&2
              printf 'Expected certificate SHA-256: %s\nActual certificate SHA-256: %s\n' "$expected" "$actual" >&2
              exit 1
            fi
            suffix="${apk##*/}"
            suffix="${suffix#app}"
            suffix="${suffix%-release.apk}"
            cp "$apk" "artifacts/opencoode-$RELEASE_TAG$suffix.apk"
          done
          cp android/app/build/outputs/bundle/release/app-release.aab "artifacts/opencoode-$RELEASE_TAG.aab"
          cd artifacts
          sha256sum ./*.apk ./*.aab > SHA256SUMS-android.txt
          {
            echo '### Android artifact sizes'
            echo
            echo '```text'
            du -h ./*.apk ./*.aab
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          gh release upload "$RELEASE_TAG" ./*.apk ./*.aab SHA256SUMS-android.txt --clobber

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/opencoode-release.jks"
