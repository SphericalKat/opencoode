name: Dependency install

on:
  pull_request:
    paths:
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/dependencies.yml
      - .github/workflows/release-build.yml

permissions:
  contents: read

concurrency:
  group: dependencies-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3.1.2
        with:
          runtime: node@26
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
